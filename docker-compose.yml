version: '3.8'

services:
  backend:
    build: ./backend
    container_name: gps-backend
    restart: always
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    volumes:
      - backend-data:/app

  frontend:
    build: ./frontend
    container_name: gps-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - gps-network

volumes:
  backend-data:

networks:
  gps-network:
    driver: bridge
